[project]
name = "humanizabr"
version = "0.1.0"
description = "Reescrita local de textos em português brasileiro com modelos via Ollama."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Por padrão, só os testes unitários rodam. Integração: pytest -m integration
addopts = "-m \"not integration\""
markers = [
    "integration: testes que usam o Ollama e um modelo local real (lentos)",
]
